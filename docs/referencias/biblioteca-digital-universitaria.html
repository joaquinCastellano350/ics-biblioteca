function mail(s,user,kind,bookId,at,ref){s.mail.push({id:uid(),user,kind,book:bookId,at,ref})}
function createLoan(s,user,id,t,reservation=null){const l={id:uid(),user,book:id,start:t,due:t+20*DAY,reservation};s.loans.push(l);for(const [kind,at] of [['day10',t+10*DAY],['due3',l.due-3*DAY],['expired',l.due]])mail(s,user,kind,id,at,l.id);return l}
function seedDemo(s,scenario='normal',t=now(s)){
 s.loans=s.loans.filter(l=>l.user!=='demo');s.entries=s.entries.filter(e=>e.user!=='demo');s.reservations=s.reservations.filter(r=>r.user!=='demo');s.mail=s.mail.filter(m=>m.user!=='demo');
 if(scenario==='empty')return;
 createLoan(s,'demo','b1',t-17*DAY);createLoan(s,'demo','b3',t-6*DAY);
 if(scenario==='limit'){for(const id of ['b4','b6','b9'])createLoan(s,'demo',id,t-2*DAY);return;}
 // Two other people ahead of the demo account in the waiting list.
 for(let n=0;n<2;n++)if(!s.entries.some(e=>e.user==='ahead-'+n&&e.book==='b2'&&e.state==='WAITING'))s.entries.push({id:uid(),user:'ahead-'+n,book:'b2',order:++s.sequence,state:'WAITING',joined:t-2*DAY});
 s.entries.push({id:uid(),user:'demo',book:'b2',order:++s.sequence,state:'WAITING',joined:t-DAY});
 const e={id:uid(),user:'demo',book:'b5',order:++s.sequence,state:'OFFERED',joined:t-3*DAY};s.entries.push(e);
 const r={id:uid(),entry:e.id,user:'demo',book:'b5',state:'HELD',offered:t-6*HOUR,expires:t+18*HOUR};s.reservations.push(r);mail(s,'demo','turn','b5',t-6*HOUR,r.id);
}
function reconcile(s,t=now(s)){
 for(const r of s.reservations){if(r.state==='HELD'&&r.expires<=t){r.state='EXPIRED';const e=s.entries.find(e=>e.id===r.entry);if(e)e.state='EXPIRED'}}
 for(const b of BOOKS){let free=availability(s,b.id,t);if(!free)continue;const waiting=s.entries.filter(e=>e.book===b.id&&e.state==='WAITING').sort((a,b)=>a.order-b.order);
 for(const e of waiting){if(!free)break;if(activeLoans(s,e.user,t).length>=LIMIT){e.state='REJECTED_LIMIT';mail(s,e.user,'limit',b.id,t,e.id);continue}e.state='OFFERED';const r={id:uid(),entry:e.id,user:e.user,book:b.id,state:'HELD',offered:t,expires:t+DAY};s.reservations.push(r);mail(s,e.user,'turn',b.id,t,r.id);free--}}
}
function loggedUser(s,t=now(s)){return s.session&&s.session.expires>t?s.users.find(u=>u.id===s.session.user):null}
function requireUser(s,t){const user=loggedUser(s,t);if(!user)throw new Error('Iniciá sesión para continuar.');return user.id}
function borrow(s,id,t=now(s)){
 const user=requireUser(s,t);reconcile(s,t);const existing=activeLoans(s,user,t).find(l=>l.book===id);if(existing)return {type:'existing',loan:existing};
 if(activeLoans(s,user,t).length>=LIMIT)return {type:'limit'};
 if(openEntries(s,user).some(e=>e.book===id))return {type:'waiting'};
 if(!availability(s,id,t))return {type:'unavailable'};
 return {type:'success',loan:createLoan(s,user,id,t)};
}
function joinQueue(s,id,t=now(s)){
 const user=requireUser(s,t);reconcile(s,t);
 if(activeLoans(s,user,t).length>=LIMIT)return {type:'limit'};
 if(activeLoans(s,user,t).some(l=>l.book===id))return {type:'existing'};
 const existing=openEntries(s,user).find(e=>e.book===id);if(existing)return {type:'waiting',entry:existing};
 if(availability(s,id,t))return {type:'available'};
 const entry={id:uid(),user,book:id,order:++s.sequence,state:'WAITING',joined:t};s.entries.push(entry);return {type:'success',entry};
}
function leaveQueue(s,id,t=now(s)){
 const user=requireUser(s,t);const e=s.entries.find(e=>e.id===id&&e.user===user);if(!e)return {type:'forbidden'};
 if(!['WAITING','OFFERED'].includes(e.state))return {type:'closed'};
 e.state='CANCELLED';s.reservations.filter(r=>r.entry===e.id&&r.state==='HELD').forEach(r=>r.state='CANCELLED');reconcile(s,t);return {type:'success'};
}
function acceptReservation(s,id,t=now(s)){
 const user=requireUser(s,t);const r=s.reservations.find(r=>r.id===id&&r.user===user);if(!r)return {type:'forbidden'};reconcile(s,t);
 if(r.state==='CONSUMED')return {type:'existing',loan:s.loans.find(l=>l.reservation===r.id)};
 if(r.state!=='HELD')return {type:r.state==='REJECTED_LIMIT'?'limit':r.state==='EXPIRED'?'expired':'closed'};
 const e=s.entries.find(e=>e.id===r.entry);
 if(activeLoans(s,user,t).length>=LIMIT){r.state='REJECTED_LIMIT';e.state='REJECTED_LIMIT';reconcile(s,t);return {type:'limit'}};
 r.state='CONSUMED';e.state='FULFILLED';return {type:'success',loan:createLoan(s,user,r.book,t,r.id)};
}
function login(s,user,t=now(s)){s.session={user,expires:t+6*HOUR}}
function advance(s,hours){s.offset+=hours*HOUR;reconcile(s);}
function simulateTurn(s,user,t=now(s)){
 const waiting=openEntries(s,user).filter(e=>e.state==='WAITING');if(!waiting.length)return false;
 const e=waiting[0];
 // In this explicit scenario, other borrowers finish. It is not an early-return action.
 s.loans.filter(l=>l.book===e.book&&l.user!==user).forEach(l=>l.due=t);
 reconcile(s,t);return true;
}

function chips(){return [...selectedAuthors.map(v=>({v,kind:'authors'})),...selectedSubjects.map(v=>({v,kind:'subjects'}))].map(x=>`<button class="chip" data-action="remove-filter" data-kind="${x.kind}" data-value="${esc(x.v)}" aria-label="Quitar filtro ${esc(x.v)}">${esc(x.v)} ${icon('close')}</button>`).join('')}
function results(){const list=searchBooks(query,selectedAuthors,selectedSubjects);return `<div class="result-meta"><span role="status"><strong>${list.length}</strong> ${list.length===1?'libro encontrado':'libros encontrados'}</span><span class="legend">Disponibilidad actual de cupos</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty-state">${icon('search')}<h2>Sin resultados</h2><p>No encontramos libros con esta combinación. Probá con otro título o quitá alguno de los filtros.</p>${button('Limpiar búsqueda y filtros','clear-all','secondary')}</div>`}`}

function protectedPage(){return `<div class="wrap"><section class="empty-state private-state">${icon('lock')}<h2>Tu biblioteca, en un solo lugar</h2><p>Ingresá a tu cuenta para ver tus préstamos activos, las fechas de vencimiento y los libros que estás esperando.</p>${button('Ingresar a mi cuenta','login','primary')}<p>¿Todavía no tenés cuenta? <a class="text-btn" href="#/registro">Registrate</a></p></section></div>`}
function loanCard(l){const b=book(l.book),days=Math.ceil((l.due-now(state))/DAY);return `<article class="loan-card"><div class="loan-card-top"><div class="book-glyph">${icon('book')}</div><div><h3>${esc(b.title)}</h3><p>${esc(b.authors.join(' · '))}</p><div class="loan-status ${days<=3?'urgent':''}">${icon(days<=3?'clock':'check')}${days<=3?'Vence pronto · ':''}${days===1?'Menos de 24 horas de lectura':`${days} días de lectura disponibles`}</div></div></div><div class="loan-card-bottom"><div><div class="date-label">Fecha de vencimiento</div><div class="due-date">${date(l.due)} <time>${time(l.due)} h</time></div></div>${button(`Leer online ${icon('external')}`,'read','primary',`data-id="${b.id}"`)}</div></article>`}
function loans(){const u=user();if(!u)return protectedPage();const active=activeLoans(state,u.id),res=held(state).filter(r=>r.user===u.id),waiting=openEntries(state,u.id).filter(e=>e.state==='WAITING');return `<div class="wrap loans-page"><div class="page-heading"><div><div class="eyebrow">Tu espacio de lectura</div><h1>Mis préstamos</h1><p>Hola, ${esc(u.first)}. Estas son tus lecturas y tus próximos turnos.</p></div><div class="loan-summary">${icon('book')}<strong>${active.length}<small> / 5</small></strong><span>préstamos<br>activos</span></div></div>${res.length?`<section class="ready-section" aria-label="Turnos disponibles"><div class="ready-label">${icon('check')} Tu próxima lectura ya tiene lugar</div>${res.map(r=>{const b=book(r.book);return `<div class="reserve-row"><div><h3>${esc(b.title)}</h3><p>Hay un cupo reservado para vos. Aceptalo para empezar tus 20 días de lectura.</p><p class="reserve-time">${icon('clock')} Tenés hasta el ${date(r.expires)}, ${time(r.expires)} h</p></div><div class="reserve-actions">${button('Aceptar préstamo','accept','primary',`data-id="${r.id}"`)}<button class="text-btn" data-action="leave" data-id="${r.entry}">Dejar pasar el turno</button></div></div>`}).join('')}</section>`:''}<div class="loans-columns"><section><div class="content-section-header"><h2>Lecturas activas <span class="number-badge">${active.length}</span></h2></div>${active.length?active.sort((a,b)=>a.due-b.due).map(loanCard).join(''):`<div class="empty-state">${icon('book')}<h2>Tu próxima lectura te espera</h2><p>Elegí un libro del catálogo y solicitá tu primer préstamo digital.</p><a href="#/catalogo" class="btn primary">Explorar catálogo ${icon('arrow')}</a></div>`}<p class="info-note">${icon('info')}<span>Los préstamos finalizan automáticamente a los 20 días. Recibirás avisos por correo a los 10 días, tres días antes del vencimiento y al vencer.</span></p></section><aside><div class="content-section-header"><h2>En espera <span class="number-badge">${waiting.length}</span></h2></div><div class="waiting-panel">${waiting.length?waiting.map(e=>{const b=book(e.book);return `<article class="waiting-item"><h3>${esc(b.title)}</h3><p>${esc(b.authors.join(' · '))}</p><div class="queue-position"><span class="queue-number">${position(state,e)}</span><span>Tu posición en la cola<br>Te avisamos por correo cuando sea tu turno.</span></div><button class="text-btn" data-action="leave" data-id="${e.id}">Salir de la cola ${icon('arrow')}</button></article>`}).join(''):`<div class="compact-empty">${icon('queue')}No estás esperando ningún libro.</div>`}</div><div class="note-box"><strong>Cuando llegue tu turno</strong>Reservamos tu cupo durante 24 horas. Podés aceptarlo desde esta página o desde el enlace del correo.</div></aside></div></div>`}

function loginPage(){return '<div class="wrap"><section class="register-layout login-layout"><div class="register-aside"><div class="eyebrow">Biblioteca digital universitaria</div><h1>Tu próxima lectura<br>está <em>más cerca.</em></h1><p>Ingresá a tu cuenta para acceder a tus libros y seguir aprendiendo.</p><div class="register-benefits"><div>'+icon('book')+' Tus lecturas en un solo lugar</div><div>'+icon('queue')+' Consultá tus próximos turnos</div><div>'+icon('clock')+' Conocé tus fechas de vencimiento</div></div><div class="register-aside-bottom">Un espacio para aprender. Una comunidad para crecer.</div></div><div class="register-form login-page-form"><h2>Ingresar</h2><p>Qué bueno verte de nuevo.</p><form id="page-login-form"><div class="field"><label for="page-email">Correo electrónico</label><input id="page-email" name="email" type="email" required autocomplete="email" placeholder="nombre@ejemplo.com"></div>'+passwordField('page-password')+'<div class="error" id="page-login-error" role="alert"></div><button class="btn primary full" type="submit">Ingresar '+icon('arrow')+'</button></form><div class="form-bottom">¿Todavía no tenés cuenta? <a href="#/registro">Creá tu cuenta</a></div><div class="login-demo"><button data-action="demo-login">Explorar con la cuenta de ejemplo '+icon('arrow')+'</button></div><p class="demo-credentials">estudiante@demo.edu · contraseña: biblioteca</p><div class="test-notice">Usá únicamente datos de prueba. Esta maqueta no autentica cuentas reales.</div></div></section></div>'}
function loginDestination(){const params=new URLSearchParams(location.hash.split('?')[1]||''),turn=params.get('turno');return turn?'/turno/'+encodeURIComponent(turn):'/'}
function finishLogin(){const page=route()==='/ingresar';save();closeModal();if($('#scenarios').open)$('#scenarios').close();pendingTurn=null;turnResult=null;if(page)navigate(loginDestination());else render()}
function render(){reconcile(state);save();header();footer();openFilter=null;const r=route();if(r.startsWith('/turno/')){renderTurn(r.split('/')[2]);return}$('#main').innerHTML=r==='/catalogo'?catalog():r==='/prestamos'?loans():r==='/registro'?registration():r==='/ingresar'?loginPage():home();document.title=(r==='/catalogo'?'Catálogo':r==='/prestamos'?'Mis préstamos':r==='/registro'?'Crear cuenta':r==='/ingresar'?'Ingresar':'Inicio')+' · Biblioteca Digital Universitaria'}

function closeModal(){$('#modal').close()}
function loginDialog(reason=''){showModal(`<div class="modal-symbol">${icon('book')}</div><h2 id="modal-title" class="modal-title">Qué bueno verte de nuevo.</h2><p class="modal-subtitle">${reason||'Ingresá para continuar con tus lecturas.'}</p><form id="login-form"><div class="field"><label for="login-email">Correo electrónico</label><input id="login-email" name="email" type="email" required autocomplete="email" placeholder="nombre@ejemplo.com"></div>${passwordField('login-password')}<div class="error" id="login-error" role="alert"></div><button type="submit" class="btn primary full" style="margin-top:24px">Ingresar ${icon('arrow')}</button></form><div class="form-bottom">¿Todavía no tenés cuenta? <button data-action="go-register">Creá tu cuenta</button></div><div class="login-demo"><button data-action="demo-login">Explorar con la cuenta de ejemplo ${icon('arrow')}</button></div><p class="demo-credentials">estudiante@demo.edu · contraseña: biblioteca</p><div class="test-notice">Usá únicamente datos de prueba. Esta maqueta no autentica cuentas reales.</div>`)}
function ensureUser(){if(user())return true;if(route()==='/catalogo')loginDialog('Para realizar esta acción, ingresá a tu cuenta. Después volvé a pulsar la opción que elegiste.');else navigate('/ingresar');return false}
function confirmBorrow(id){if(!ensureUser())return;const b=book(id);if(activeLoans(state,user().id).length>=LIMIT){limitDialog();return}showModal(`<div class="modal-symbol">${icon('book')}</div><h2 class="modal-title" id="modal-title">Una nueva lectura te espera.</h2><p class="modal-subtitle">Confirmá el préstamo para empezar a leer online.</p><div class="modal-book"><h3>${esc(b.title)}</h3><p>${esc(b.authors.join(' · '))}</p></div><div class="modal-details"><div><span>Duración del préstamo</span><strong>20 días</strong></div><div><span>Vencimiento estimado</span><strong>${date(now(state)+20*DAY)}</strong></div><div><span>Tus préstamos activos</span><strong>${activeLoans(state,user().id).length} de 5</strong></div></div><p class="info-note">${icon('info')}El acceso termina automáticamente al vencer el préstamo.</p><div class="modal-buttons">${button('Ahora no','close-modal','secondary')}${button('Confirmar préstamo','confirm-borrow','primary',`data-id="${id}"`)}</div>`)}
function limitDialog(){showModal(`<div class="modal-symbol">${icon('book')}</div><h2 id="modal-title" class="modal-title">Ya tenés 5 préstamos activos.</h2><p class="modal-subtitle">Alcanzaste el límite de esta biblioteca. Podrás solicitar otro libro o entrar en una cola cuando venza alguno de tus préstamos.</p><div class="modal-buttons">${button('Entendido','close-modal','secondary')}${button('Ver mis préstamos','myloans','primary')}</div>`)}
function loanSuccess(l,existing=false){const b=book(l.book);showModal(`<div class="success-icon">${icon('check')}</div><h2 id="modal-title" class="modal-title">${existing?'Tu préstamo ya está listo.':'¡El libro ya es parte de tus lecturas!'}</h2><p class="modal-subtitle">${esc(b.title)}</p><div class="modal-book"><span class="date-label">Tu acceso está disponible hasta</span><h3 style="margin-top:6px">${date(l.due)}, ${time(l.due)} h</h3></div><div class="modal-buttons">${button('Mis préstamos','myloans','secondary')}${button(`Empezar a leer ${icon('external')}`,'read','primary',`data-id="${b.id}"`)}</div>`)}
function processBorrow(id){if(!ensureUser())return;const out=borrow(state,id);save();render();if(out.type==='success'||out.type==='existing')loanSuccess(out.loan,out.type==='existing');else if(out.type==='limit')limitDialog();else if(out.type==='unavailable')showModal(`<div class="modal-symbol">${icon('queue')}</div><h2 id="modal-title" class="modal-title">El último cupo acaba de ocuparse.</h2><p class="modal-subtitle">Otra persona lo solicitó antes de tu confirmación. Podés sumarte a la cola y te avisaremos cuando sea tu turno.</p><div class="modal-buttons">${button('Volver al catálogo','close-modal','secondary')}${button('Unirme a la cola','queue','primary',`data-id="${id}"`)}</div>`);else{closeModal();toast('Ya estás esperando este libro. Consultá el turno en Mis préstamos.')}}
function processQueue(id){if(!ensureUser())return;const out=joinQueue(state,id);save();render();if(out.type==='limit'){limitDialog();return}if(out.type==='available'){toast('Ahora hay un cupo disponible. Podés solicitar el préstamo.');closeModal();return}if(out.type!=='success'){closeModal();toast(out.type==='existing'?'Ya tenés este libro prestado.':'Ya estás en la cola de este libro.');return}showModal(`<div class="success-icon">${icon('check')}</div><h2 id="modal-title" class="modal-title">Ya estás en la cola.</h2><p class="modal-subtitle">${esc(book(id).title)}</p><div class="modal-book"><div class="date-label">Tu posición actual</div><h3 style="margin-top:8px">${position(state,out.entry)} en la cola</h3><p>Te avisamos a ${esc(user().email)} cuando sea tu turno. Tendrás 24 horas para aceptar el cupo.</p></div><div class="modal-buttons">${button('Seguir explorando','close-modal','secondary')}${button('Ver mis esperas','myloans','primary')}</div>`)}
function confirmLeave(id){if(!ensureUser())return;const e=state.entries.find(e=>e.id===id&&e.user===user().id);if(!e)return;showModal(`<div class="modal-symbol">${icon('queue')}</div><h2 id="modal-title" class="modal-title">${e.state==='OFFERED'?'¿Querés dejar pasar este turno?':'¿Querés salir de la cola?'}</h2><p class="modal-subtitle">${esc(book(e.book).title)}. Tu posición se liberará. Si volvés a unirte, entrarás al final de la cola.</p><div class="modal-buttons">${button('Seguir esperando','close-modal','secondary')}${button('Sí, salir de la cola','confirm-leave','primary',`data-id="${id}"`)}</div>`)}
function reservationMessage(type){return {expired:{title:'El plazo de tu reserva terminó.',body:'El cupo se ofreció a la siguiente persona de la cola. Podés volver al catálogo y solicitar el libro o sumarte de nuevo a la espera.'},limit:{title:'La reserva se canceló por el límite de préstamos.',body:'Ya tenés 5 préstamos activos. No se creó otro préstamo y tu posición se retiró de la cola. El cupo pasa a la siguiente persona elegible o queda disponible.'},forbidden:{title:'No podemos aceptar esta reserva.',body:'El enlace no está disponible para esta cuenta. Ingresá con la cuenta que recibió el aviso de turno.'},closed:{title:'Esta reserva ya no está disponible.',body:'El turno se dejó pasar o la reserva se canceló. Podés consultar los cupos actuales desde el catálogo.'}}[type]||{title:'No pudimos completar la acción.',body:'Volvé a intentar desde Mis préstamos.'}}
function processAccept(id,asPage=false){if(!user()){navigate('/ingresar?turno='+encodeURIComponent(id));return}const out=acceptReservation(state,id);save();if(asPage){turnResult={id,out};renderTurn(id);return}render();if(out.type==='success'||out.type==='existing')loanSuccess(out.loan,out.type==='existing');else{const text=reservationMessage(out.type);showModal(`<div class="modal-symbol">${icon('info')}</div><h2 id="modal-title" class="modal-title">${text.title}</h2><p class="modal-subtitle">${text.body}</p><div class="modal-buttons">${button('Ir a mis préstamos','myloans','primary')}</div>`)}}
function renderTurn(id){if(!user()){$('#main').innerHTML=`<div class="wrap"><section class="turn-result"><div class="modal-symbol">${icon('mail')}</div><h1>Tu turno te está esperando.</h1><p>Para aceptar el cupo, ingresá con la cuenta que recibió el correo. La aceptación continuará automáticamente.</p><div class="modal-buttons">${button('Ingresar y continuar','turn-login','primary',`data-id="${esc(id)}"`)}</div></section></div>`;pendingTurn=id;return}if(!turnResult||turnResult.id!==id){processAccept(id,true);return}const out=turnResult.out,success=['success','existing'].includes(out.type);const msg=success?{title:out.type==='success'?'¡Tu préstamo está confirmado!':'Este enlace ya fue utilizado.',body:out.loan.due>now(state)?`El préstamo de ${book(out.loan.book).title} ya existe. Podés leer hasta el ${date(out.loan.due)}, ${time(out.loan.due)} h. No se creó un préstamo adicional.`:'El préstamo asociado a este enlace ya terminó. Podés explorar el catálogo para solicitarlo de nuevo.'}:reservationMessage(out.type);$('#main').innerHTML=`<div class="wrap"><section class="turn-result"><div class="${success?'success-icon':'modal-symbol'}">${icon(success?'check':'info')}</div><h1>${esc(msg.title)}</h1><p>${esc(msg.body)}</p><div class="modal-buttons"><a href="#/prestamos" class="btn primary">Ver mis préstamos ${icon('arrow')}</a><a href="#/catalogo" class="btn secondary">Ir al catálogo</a></div></section></div>`}
async function hashPassword(text){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(bytes),x=>x.toString(16).padStart(2,'0')).join('')}
async function doLogin(form){const fields=new FormData(form),email=String(fields.get('email')).trim().toLowerCase(),password=String(fields.get('password'));const u=state.users.find(u=>u.email===email),hash=await hashPassword(password);if(!u||((u.id==='demo')?password!=='biblioteca':u.passwordHash!==hash)){const error=$('#'+(form.id==='page-login-form'?'page-login-error':'login-error'));error.textContent='El correo o la contraseña no son correctos. Revisá los datos e intentá otra vez.';return}login(state,u.id);finishLogin();if(!route().startsWith('/turno/'))toast('¡Bienvenido/a, '+u.first+'!')}
function demoLogin(){login(state,'demo');finishLogin();if(!route().startsWith('/turno/'))toast('Ingresaste con la cuenta de ejemplo. Podés probar todas las interacciones.')}
async function doRegister(form){const f=new FormData(form),first=String(f.get('first')).trim(),last=String(f.get('last')).trim(),faculty=String(f.get('faculty')),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));const error=$('#register-error');if(!first||!last||!FACULTIES.includes(faculty)||!password){error.textContent='Completá todos los campos indicados.';return}if(state.users.some(u=>u.email===email)){error.textContent='Ya hay una cuenta registrada con este correo. Podés ingresar desde el enlace de abajo.';return}const u={id:crypto.randomUUID(),first,last,faculty,email,passwordHash:await hashPassword(password)};state.users.push(u);login(state,u.id);save();navigate('/');toast('¡Tu cuenta de prueba está lista! Bienvenido/a, '+first+'.')}
function pdfBytes(title){const safe=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').replace(/[()\\]/g,'\\$&');const lines=['BIBLIOTECA DIGITAL UNIVERSITARIA','Documento de demostracion',...title.match(/.{1,50}(\s|$)|.{1,50}/g).map(s=>s.trim()),'','Este PDF es un material original de prueba de la maqueta.','No reproduce el contenido del libro seleccionado.','','En el producto final se abrira aqui el archivo autorizado','correspondiente a un prestamo vigente.','','La bibliografia acompana tu aprendizaje.'];let stream='BT /F1 14 Tf 55 760 Td 24 TL\n'+lines.map((s,i)=>(i?'T* ':'')+'('+safe(s)+') Tj').join('\n')+'\nET';const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((o,i)=>{offsets.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;return new TextEncoder().encode(pdf)}
function readBook(id){if(!ensureUser())return;reconcile(state);const l=activeLoans(state,user().id).find(l=>l.book===id);if(!l){toast('Este préstamo ya no está vigente. Consultá el catálogo para solicitarlo de nuevo.');render();return}const url=URL.createObjectURL(new Blob([pdfBytes(book(id).title)],{type:'application/pdf'}));const opened=window.open(url,'_blank');if(opened)opened.opener=null;else toast('Permití abrir una nueva pestaña para ver el PDF de demostración.');setTimeout(()=>URL.revokeObjectURL(url),60000)}
function scenarioPanel(){const u=user(),mails=u?state.mail.filter(m=>m.user===u.id&&m.at<=now(state)).sort((a,b)=>b.at-a.at):[];const titles={turn:'Tu turno llegó',day10:'Ya pasaron 10 días de tu préstamo',due3:'Tu préstamo vence en 3 días',expired:'Tu préstamo finalizó',limit:'Tu posición en cola se canceló'};$('#scenarios').innerHTML=`<button class="icon-btn modal-close" data-action="close-scenarios" aria-label="Cerrar escenarios">${icon('close')}</button><div class="eyebrow" style="margin-bottom:14px">Para revisar con el equipo</div><h2 id="scenario-title">Probá la experiencia.</h2><p class="modal-subtitle">Estos controles cambian datos de ejemplo en tu navegador. No pertenecen al producto final.</p><div class="scenario-options">${button(`Ingresar como Lucía Pérez ${icon('arrow')}`,'demo-login','secondary')}</div><p class="scenario-note">Cuenta de ejemplo: estudiante@demo.edu<br>Contraseña: biblioteca. No se envían correos reales.</p><div class="scenario-group"><h3>Estados de la cuenta de ejemplo</h3><div class="scenario-options">${button('2 préstamos + cola + turno reservado','scenario','secondary','data-value="normal"')}${button('Sin préstamos ni esperas','scenario','secondary','data-value="empty"')}${button('Límite de 5 préstamos activos','scenario','secondary','data-value="limit"')}${button('Reserva pendiente + límite de 5 préstamos','scenario','secondary','data-value="limit-reserve"')}${button('El último cupo se agota al confirmar','race','secondary')}</div><p class="scenario-note">Estos escenarios restauran los datos de ejemplo e inician sesión como Lucía. Las cuentas de prueba que creaste se conservan.</p></div><div class="scenario-group"><h3>Simular el paso del tiempo</h3><div class="scenario-options">${button('Liberar cupos para las personas de la cola','simulate-turn','secondary')}${button('Avanzar 24 horas · vencer una reserva','advance','secondary','data-hours="24"')}${button('Avanzar 20 días · vencer préstamos','advance','secondary','data-hours="480"')}${button('Vencer la sesión actual','expire-session','secondary')}</div><p class="scenario-note">Al avanzar más de 6 horas también vence la sesión. Volvé a ingresar con la cuenta de ejemplo para ver el resultado.</p><div class="scenario-clock">Reloj de prueba: ${date(now(state))}, ${time(now(state))} h</div></div><div class="scenario-group"><h3>Correos de ejemplo <span class="number-badge">${mails.length}</span></h3><p class="scenario-note">Representación de los avisos por correo de las historias. Los enlaces de turno vuelven a validar la reserva y la cuenta.</p>${mails.length?mails.map(m=>`<article class="scenario-mail"><strong>${titles[m.kind]}</strong><p>${esc(book(m.book).title)}</p>${m.kind==='turn'?`<button class="text-btn" data-action="mail-turn" data-id="${m.ref}">Abrir enlace para aceptar ${icon('external')}</button>`:m.kind==='limit'?'<p>Se alcanzó el límite de cinco préstamos al llegar el turno.</p>':`<p>Vencimiento: ${date(state.loans.find(l=>l.id===m.ref)?.due||m.at)}</p>`}<small>${date(m.at)}, ${time(m.at)} h · Para ${esc(u.email)}</small></article>`).join(''):'<div class="compact-empty">Ingresá con una cuenta para ver sus correos de ejemplo.</div>'}</div><div class="scenario-group"><h3>Documentación de referencia</h3><div class="source-links"><a target="_blank" rel="noopener" href="https://joaquincastellano350.atlassian.net/wiki/spaces/SCRUM/pages/196609">PRD</a><a target="_blank" rel="noopener" href="https://joaquincastellano350.atlassian.net/wiki/spaces/SCRUM/pages/5177345">ADR</a><a target="_blank" rel="noopener" href="https://joaquincastellano350.atlassian.net/wiki/spaces/SCRUM/pages/6389762">Modelo de datos</a><a target="_blank" rel="noopener" href="https://joaquincastellano350.atlassian.net/jira/software/projects/SCRUM/boards/1/backlog">Jira</a></div><p class="scenario-note">Maqueta en HTML, CSS y JavaScript. El MVP acordado sigue siendo Angular + API Node/TypeScript + PostgreSQL. La privacidad, las transacciones y el correo reales requieren ese backend.</p></div>`;if(!$('#scenarios').open)$('#scenarios').showModal()}
function resetScenario(value){const accounts=state.users.filter(u=>u.id!=='demo');state=newState();state.users.push(...accounts);seedDemo(state,value==='limit-reserve'?'normal':value);login(state,'demo');if(value==='limit-reserve')for(const id of ['b4','b6','b9'])borrow(state,id);pendingTurn=null;turnResult=null;save()}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target){if(openFilter&&!e.target.closest('.filter-wrap')){openFilter=null;renderCatalogTools()}return}const a=target.dataset.action,id=target.dataset.id;
 switch(a){case'login':navigate('/ingresar');break;case'close-modal':closeModal();break;case'go-register':closeModal();pendingTurn=null;navigate('/registro');break;case'logout':state.session=null;pendingTurn=null;turnResult=null;save();render();toast('Cerraste sesión. El catálogo sigue disponible.');break;case'demo-login':demoLogin();break;case'borrow':confirmBorrow(id);break;case'confirm-borrow':processBorrow(id);break;case'queue':processQueue(id);break;case'myloans':closeModal();navigate('/prestamos');break;case'read':readBook(id);break;case'leave':confirmLeave(id);break;case'confirm-leave':if(ensureUser()){leaveQueue(state,id);save();closeModal();render();toast('Saliste de la cola.')}break;case'accept':processAccept(id);break;case'turn-login':navigate('/ingresar?turno='+encodeURIComponent(id));break;
 case'toggle-password':{const field=document.getElementById(id),show=field.type==='password';field.type=show?'text':'password';target.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');target.setAttribute('aria-pressed',String(show));break}
 case'filter':openFilter=openFilter===target.dataset.kind?null:target.dataset.kind;filterQuery='';renderCatalogTools();if(openFilter)$('#filter-search').focus();break;
 case'close-filter':{const k=openFilter;openFilter=null;renderCatalogTools();$(`[data-kind="${k}"]`)?.focus();break}
 case'clear-filter':if(target.dataset.kind==='authors')selectedAuthors=[];else selectedSubjects=[];renderCatalogTools();updateResults();break;
 case'remove-filter':if(target.dataset.kind==='authors')selectedAuthors=selectedAuthors.filter(v=>v!==target.dataset.value);else selectedSubjects=selectedSubjects.filter(v=>v!==target.dataset.value);renderCatalogTools();updateResults();break;
 case'clear-all':query='';selectedAuthors=[];selectedSubjects=[];render();$('#catalog-search')?.focus();break;case'refresh':reconcile(state);save();render();toast('Disponibilidad actualizada.');break;case'scenarios':scenarioPanel();break;case'close-scenarios':$('#scenarios').close();break;
 case'scenario':resetScenario(target.dataset.value);$('#scenarios').close();navigate('/prestamos');render();toast('Escenario de prueba cargado.');break;
 case'race':resetScenario('normal');$('#scenarios').close();location.hash='/catalogo';render();confirmBorrow('b11');state.loans.push({id:crypto.randomUUID(),user:'sample-race',book:'b11',start:now(state),due:now(state)+20*DAY});save();break;
 case'advance':advance(state,Number(target.dataset.hours));save();render();scenarioPanel();toast('Avanzó el reloj de prueba. La sesión puede haber vencido.');break;
 case'expire-session':if(state.session)state.session.expires=now(state)-1;save();render();scenarioPanel();toast('Sesión vencida. Las funciones personales requieren ingresar de nuevo.');break;
 case'simulate-turn':if(!user()){toast('Ingresá primero con la cuenta de ejemplo.');break}if(simulateTurn(state,user().id)){save();render();scenarioPanel();toast('Se liberaron cupos y se atendió la cola en orden.')}else toast('Esta cuenta no tiene libros en espera. Cargá el escenario con cola.');break;
 case'mail-turn':$('#scenarios').close();turnResult=null;pendingTurn=null;navigate('/turno/'+id);break;
 }
});
function renderCatalogTools(){if(route()!=='/catalogo')return;const tools=$('.catalog-tools');if(!tools)return;tools.querySelectorAll('.filter-wrap').forEach(x=>x.remove());tools.insertAdjacentHTML('beforeend',filterMenu('authors')+filterMenu('subjects'))}
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){query=e.target.value;updateResults()}else if(e.target.id==='filter-search'){filterQuery=e.target.value;$('#filter-options').innerHTML=filterOptions(openFilter)}});
document.addEventListener('change',e=>{if(!e.target.dataset.filter)return;const kind=e.target.dataset.filter,value=e.target.value;let selected=kind==='authors'?selectedAuthors:selectedSubjects;selected=e.target.checked?[...new Set([...selected,value])]:selected.filter(v=>v!==value);if(kind==='authors')selectedAuthors=selected;else selectedSubjects=selected;updateResults();const btn=$(`[data-action="filter"][data-kind="${kind}"]`);btn.querySelector('.filter-count')?.remove();if(selected.length)btn.insertAdjacentHTML('beforeend',`<b class="filter-count">${selected.length}</b>`);btn.classList.toggle('selected',selected.length>0)});
document.addEventListener('submit',async e=>{if(e.target.id==='hero-search'){e.preventDefault();query=new FormData(e.target).get('title');navigate('/catalogo')}else if(['login-form','page-login-form','register-form'].includes(e.target.id)){e.preventDefault();const submit=e.target.querySelector('[type="submit"]');submit.disabled=true;try{await(e.target.id==='register-form'?doRegister(e.target):doLogin(e.target))}catch{const err=e.target.querySelector('.error');if(err)err.textContent='No se pudo completar la acción. Intentá otra vez.'}finally{submit.disabled=false}}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openFilter){const k=openFilter;openFilter=null;renderCatalogTools();$(`[data-action="filter"][data-kind="${k}"]`)?.focus()}});
window.addEventListener('hashchange',()=>{turnResult=null;pendingTurn=null;render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})});
window.addEventListener('storage',e=>{if(e.key===key){try{const next=JSON.parse(e.newValue);if(next?.version===1){state=next;turnResult=null;render()}}catch{}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){reconcile(state);if(route()==='/prestamos'||route().startsWith('/turno/'))render();else header()}});
setInterval(()=>{const onProtected=route()==='/prestamos'||route().startsWith('/turno/');if(onProtected&&!user()&&state.session){state.session=null;turnResult=null;render();toast('Tu sesión venció. Ingresá de nuevo para continuar.')}},15000);
render();

</script>
