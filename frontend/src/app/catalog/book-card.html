<article class="book-card" [attr.aria-labelledby]="'book-' + book().id">
  <p-card
    [style]="{ height: '100%' }"
    [dt]="{ root: { borderRadius: '14px', shadow: 'none' }, body: { padding: '26px' } }"
  >
    <div class="book-kind" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15" />
      </svg>
      <span>Bibliografía universitaria</span>
    </div>
    <h2 [id]="'book-' + book().id" [title]="book().title">{{ book().title }}</h2>
    <div class="metadata">
      <h3>Autores</h3>
      <ul class="authors" aria-label="Autores">
        @for (author of book().authors; track author.id) {
          <li [title]="author.name">{{ author.name }}</li>
        }
      </ul>
    </div>
    <div class="metadata subjects-block">
      <h3>Materias</h3>
      <ul class="subjects" aria-label="Materias">
        @for (subject of book().subjects; track subject.id) {
          <li [title]="subject.name">{{ subject.name }}</li>
        }
      </ul>
    </div>
  </p-card>
</article>
