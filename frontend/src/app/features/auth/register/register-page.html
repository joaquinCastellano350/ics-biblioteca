<main class="register-page">
  <nav aria-label="Navegación del registro">
    <a routerLink="/">← Volver al inicio</a>
  </nav>

  <app-register
    [universities]="universities()"
    [universitiesLoading]="universitiesLoading()"
    [universitiesError]="universitiesError()"
    [loading]="submitting()"
    [submitDisabled]="registered()"
    [errorMessage]="registrationError()"
    [fieldErrors]="registrationFieldErrors()"
    (registerRequested)="register($event)" />

  @if (!universitiesLoading() && (universitiesError() || universities().length === 0)) {
    <div class="retry-actions">
      <button type="button" class="retry-button" (click)="loadUniversities()">
        {{ universitiesError() ? 'Reintentar' : 'Volver a consultar facultades' }}
      </button>
    </div>
  }
</main>
