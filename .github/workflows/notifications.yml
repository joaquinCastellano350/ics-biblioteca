name: Deliver notifications

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deliver-notifications
  cancel-in-progress: false

jobs:
  deliver:
    # Activar después de aplicar migraciones y configurar los cuatro secretos.
    if: vars.NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate --workspace backend

      - name: Deliver pending notices
        run: npm run notifications:deliver --workspace backend
        env:
          DATABASE_URL: ${{ secrets.NOTIFICATIONS_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PUBLIC_WEB_ORIGIN: ${{ secrets.PUBLIC_WEB_ORIGIN }}
