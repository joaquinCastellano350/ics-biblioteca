name: Reconcile circulation

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-circulation
  cancel-in-progress: false

jobs:
  reconcile:
    if: vars.CIRCULATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up npm
        run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate --workspace backend
      - name: Reconcile pending books
        run: npm run circulation:reconcile --workspace backend
        env:
          DATABASE_URL: ${{ secrets.CIRCULATION_DATABASE_URL }}
