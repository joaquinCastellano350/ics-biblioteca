name: Release checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      PLAYWRIGHT_CHANNEL: chromium
    services:
      turns-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ics_turns_test
          POSTGRES_USER: turns_test_admin
          POSTGRES_PASSWORD: turns_ci_only
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U turns_test_admin -d ics_turns_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      notifications-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ics_notifications_test
          POSTGRES_USER: notifications_test_admin
          POSTGRES_PASSWORD: notifications_ci_only
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U notifications_test_admin -d ics_notifications_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ics_accounts_test
          POSTGRES_USER: accounts_test_admin
          POSTGRES_PASSWORD: accounts_ci_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U accounts_test_admin -d ics_accounts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate database schema
        run: npm run db:validate --workspace backend

      - name: Run frontend and backend tests
        run: npm test

      - name: Run accounts integration with isolated PostgreSQL
        run: npm run test:integration --workspace backend
        env:
          TEST_DATABASE_URL: postgresql://accounts_test_admin:accounts_ci_only@127.0.0.1:55432/ics_accounts_test
          ACCOUNTS_ALLOW_INTEGRATION_WRITES: '1'

      - name: Run notification integration with isolated PostgreSQL
        run: npm run test:notifications:integration --workspace backend
        env:
          TEST_NOTIFICATIONS_DATABASE_URL: postgresql://notifications_test_admin:notifications_ci_only@127.0.0.1:55434/ics_notifications_test
          NOTIFICATIONS_ALLOW_INTEGRATION_WRITES: '1'

      - name: Run turn integration with isolated PostgreSQL
        run: npm run test:turns:integration --workspace backend
        env:
          TEST_TURNS_DATABASE_URL: postgresql://turns_test_admin:turns_ci_only@127.0.0.1:55435/ics_turns_test
          TURNS_ALLOW_INTEGRATION_WRITES: '1'

      - name: Build production applications
        run: npm run build

      - name: Install test browser
        timeout-minutes: 5
        # ubuntu-24.04 already includes the system libraries used by Chrome.
        run: npm exec --workspace frontend -- playwright install chromium

      - name: Run browser tests
        run: npm run test:e2e --workspace frontend

      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: node_modules/.cache/playwright-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
